<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f4f1eb" />
    <script>
      (() => {
        try {
          const theme = localStorage.getItem('weave.theme');
          if (theme === 'light' || theme === 'dark') {
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#17150f' : '#f4f1eb');
          }
        } catch { /* local-only preference is best effort */ }
      })();
    </script>
    <title>Weave — offline writing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
